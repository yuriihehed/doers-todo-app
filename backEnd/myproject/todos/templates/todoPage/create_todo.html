<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create ToDo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- Custom styles for header and overall layout -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            border: 1px solid black;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid black;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        .header div, .header a {
            color: black;
            margin-right: 5px;
        }
        .logo {
            max-width: 400px;
            margin-top: 80px;
        }
        .button-link {
            display: inline-block;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <!-- Main container for the page content -->
    <div class="container">
        <!-- Header section -->
        <div class="header">
            <!-- Left section of the header (can be used for logo or branding) -->
            <div class="left">
                <div>$APPNAME</div>
                <a href="/todos/about" class="button-link button-login">About</a>
            </div>

            <!-- Right section of the header (navigation links) -->
            <div class="right">
                <a href="/todos/dashboard" class="button-link">Dashboard</a>
                <a href="/todos/dashboard" class="button-link">Todos</a>
                <a href="/todos/teams" class="button-link">Teams</a>
                <a href="/todos/logout" class="button-link">{{ user.email }}</a> <!-- Display user's email -->
            </div>
        </div>

        <!-- Page Title -->
        <h1>Create ToDo</h1>
        <!-- Section to display messages (success or error messages) -->
        {% if messages %}
            <div>
                {% for message in messages %}
                    <!-- Message alert with specific style depending on message type -->
                    <div class="alert {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Form to create a ToDo -->
        <form method="post">
            {% csrf_token %}
            <!-- Input for title -->
            <div class="mb-3">
                <div class="d-flex justify-content-start">
                    <label for="id_title" class="form-label">Title</label>
                </div>
                {{ form.title }}
            </div>

            <!-- Input for description -->
            <div class="mb-3">
                <div class="d-flex justify-content-start">
                    <label for="id_description" class="form-label">Description</label>
                </div>
                {{ form.description }}
            </div>

            <!-- Input for due date -->
            <div class="mb-3">
                <div class="d-flex justify-content-start">
                    <label for="id_due_date" class="form-label">Due Date</label>
                </div>
                {{ form.due_date }}
            </div>

            <!-- Input for category -->
            <div class="mb-3">
                <div class="d-flex justify-content-start">
                    <label for="id_category" class="form-label">Category</label>
                </div>
                {{ form.category }}
            </div>

            <!-- Input for team -->
            <div class="mb-3">
                <div class="d-flex justify-content-start">
                    <label for="id_team" class="form-label">Team</label>
                </div>
                {{ form.team }}
            </div>

            <!-- Buttons to save or cancel the form -->
            <div class="d-flex justify-content-end">
                <a href="#" class="btn btn-danger me-3">Cancel</a>
                <button type="submit" class="btn btn-success me-3">Save</button>
            </div>
        </form>
    </div>
</body>
</html>
