{% load static %}
<!DOCTYPE html>
<html lang="en">


<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Create ToDo</title>
   <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
       body {
           font-family: Arial, sans-serif;
           background-color: #fffef2;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
       }


       .container {
           border: 1px solid black;
           text-align: center;
           width: 100%;
           height: 100%;
           padding: 20px;
           box-sizing: border-box;
           position: relative;
       }


       .header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           width: 100%;
           border-bottom: 1px solid black;
           padding-bottom: 10px;
           margin-bottom: 20px;
       }


       .left {
           display: flex;
           align-items: center;
       }


       .right {
           display: flex;
           align-items: center;
           margin-left: auto;
       }


       .header div,
       .header a {
           color: black;
           margin-right: 5px;
       }


       .button-link {
           display: inline-block;
           padding: 10px 15px;
           font-size: 16px;
           color: white;
           background-color: rgb(182, 182, 230);
           border: none;
           border-radius: 5px;
           text-decoration: none;
           text-align: center;
           margin-top: 2px;
       }


       .form-container {
           max-width: 500px;
           margin: 0 auto;
           background-color: #fff;
           border: 1px solid #ccc;
           padding: 20px;
           border-radius: 5px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
           text-align: left;
       }


       .form-container h2 {
           margin-bottom: 20px;
           text-align: center;
       }


       .form-control {
           margin-bottom: 15px;
       }


       .form-label {
           display: block;
           margin-bottom: 5px;
           text-align: left;
       }


       .error-message {
           color: red;
           font-size: 14px;
           margin-bottom: 15px;
       }


       .buttons {
           display: flex;
           justify-content: space-between;
       }


       .buttons button {
           flex: 1;
           margin: 0 5px;
       }
   </style>
</head>


<body>
   <div class="container">
       <div class="header">
           <div class="left">
            <a href="/" class="button-link" style="background: none; padding: 0; border: none; margin-right: 10px; ">
                <img src=" {% static 'todos/images/DoersLogo.png' %}" style="width: 120px; height: 74px; object-fit: cover; border-radius: 25%;">
            </a>
               <a href="/about" class="button-link button-login">About</a>
           </div>
           <div class="right">
               <a href="/dashboard" class="button-link">Dashboard</a>
               <a href="/todos/new" class="button-link">Todos</a>
               <a href="/teams/new" class="button-link">Teams</a>
               <a href="/logout" class="button-link">{{ user.email }}</a>
           </div>
       </div>


       <div class="form-container">
           <h2>Create ToDo</h2>
           <form method="POST">
               {% csrf_token %}
               <!-- Title Field -->
               <div class="mb-3">
                   <label for="id_title" class="form-label">Title</label>
                   {{ form.title }} <!-- Render the title field from the form -->
               </div>


               <!-- Description Field -->
               <div class="mb-3">
                   <label for="id_description" class="form-label">Description</label>
                   {{ form.description }} <!-- Render the description field from the form -->
               </div>


               <!-- Due Date Field -->
               <div class="mb-3">
                   <label for="id_deadline" class="form-label">Due Date</label>
                   <input
                       type="date"
                       id="id_deadline"
                       name="deadline"
                       class="form-control"
                       value="{{ form.deadline.value|default:'' }}"
                       min="{{ today_date }}"
                       {% if form.deadline.errors %} aria-invalid="true" {% endif %}
                   />
                   {% if form.deadline.errors %}
                   <div class="error-message">
                       {% for error in form.deadline.errors %}
                           <p>{{ error }}</p>
                       {% endfor %}
                   </div>
                   {% endif %}
               </div>
              
              
              


               <!-- Category Field -->
               <div class="mb-3">
                   <label for="id_state" class="form-label">Category</label>
                   {{ form.state }} <!-- Assuming the state field in the model corresponds to category -->
               </div>


               <!-- Team Field -->
               <div class="mb-3">
                   <label for="id_team" class="form-label">Select a Team</label>
                   <select name="team" id="id_team" class="form-control" required>
                       <option value="" disabled selected>Select a team</option>
                       {% for team in teams %}
                           <option value="{{ team.id }}">{{ team.name }}</option>
                       {% endfor %}
                   </select>
               </div>
              
              
              
              
          


               <!-- Action Buttons -->
               <div class="buttons">
                   <a href="/dashboard" class="btn btn-danger me-3">Cancel</a>
                   <button type="submit" class="btn btn-success">Save</button>
               </div>
           </form>
       </div>
   </div>


   <!-- Bootstrap JS -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
