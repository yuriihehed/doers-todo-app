{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{% block title %}My Application{% endblock %}</title>
   <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="{% static 'todos/css/stylesheet.css' %}">
   <style>
       /* Original body styling to center the main container */
       body {
           font-family: Arial, sans-serif;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
       }
 
       /* Original container styling – note that this custom class overrides Bootstrap’s .container */
       .container {
           border: 1px solid black;
           text-align: center;
           width: 100%;
           height: 100%;
           padding: 20px;
           box-sizing: border-box;
           position: relative;
       }
 
       /* Common styling for the form container (if needed) */
       .form-container {
           max-width: 500px;
           margin: 0 auto;
           background-color: #fff;
           border: 1px solid #ccc;
           padding: 20px;
           border-radius: 5px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
           text-align: left;
       }
   </style>
   {% block extra_head %}{% endblock %}
</head>
<body>
   <div class="container">
       <!-- Bootstrap Navbar Header -->
       <nav class="navbar navbar-expand-lg navbar-light bg-light">
           <div class="container-fluid">
               <a class="navbar-brand" href="/">
                   <img src="{% static 'todos/images/DoersLogo.png' %}" alt="Logo" 
                        style="width:120px; height:74px; object-fit: cover; border-radius:15%;">
               </a>
               <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                       data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" 
                       aria-expanded="false" aria-label="Toggle navigation">
                   <span class="navbar-toggler-icon"></span>
               </button>
               <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                   <div class="navbar-nav me-auto">
                       <a class="nav-link" href="/about">About</a>
                   </div>
                   <div class="navbar-nav">
                       <a class="nav-link" href="/dashboard">Dashboard</a>
                       <a class="nav-link" href="/todos/new">Todos</a>
                       <a class="nav-link" href="/teams/new">Teams</a>
                       <a class="nav-link" href="/logout">{{ user.email }}</a>
                   </div>
               </div>
           </div>
       </nav>
 
       <!-- Block for page-specific content -->
       {% block content %}
       {% endblock %}
   </div>
 
   <!-- Common scripts -->
   <script>
       document.addEventListener("DOMContentLoaded", function () {
           const teamSelect = document.getElementById("id_team");
           const assignedToSelect = document.getElementById("id_assigned_to");
 
           if (teamSelect) { // only if the element exists on the page
               teamSelect.addEventListener("change", function () {
                   assignedToSelect.innerHTML = "";  // Clear previous options
 
                   // Get selected option and its data-members attribute
                   const selectedOption = teamSelect.options[teamSelect.selectedIndex];
                   const members = JSON.parse(selectedOption.getAttribute("data-members"));
 
                   if (members.length > 0) {
                       members.forEach(member => {
                           let option = document.createElement("option");
                           option.value = member.id;
                           option.textContent = member.email;
                           assignedToSelect.appendChild(option);
                       });
                   } else {
                       let option = document.createElement("option");
                       option.value = "";
                       option.textContent = "No members in this team";
                       assignedToSelect.appendChild(option);
                   }
               });
           }
       });
   </script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   {% block extra_js %}{% endblock %}
</body>
</html>
