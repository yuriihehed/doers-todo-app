{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team</title>
    <link rel="stylesheet" href="{% static 'todos/css/stylesheet.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffef2;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
        }
        .header .left {
            display: flex;
            align-items: center;
        }
        .header .left span {
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
        }
        .header a {
            text-decoration: none;
            color: #007bff;
            margin-left: 15px;
        }
        .header .right {
            display: flex;
            align-items: center;
        }
        .header .right span {
            margin-right: 15px;
            font-size: 14px;
            color: #333;
        }
        .main-container {
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input.error, textarea.error {
            border: 1px solid red;
            background-color: #ffe6e6;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin: -10px 0 10px 0;
        }
        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button.cancel {
            background-color: #dc3545;
            color: white;
        }
        button.create {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="header">
        <div class="left">
            <a href="/" class="button-link" style="background: none; padding: 0; border: none; margin-right: 10px; ">
                <img src=" {% static 'todos/images/DoersLogo.png' %}" style="width: 120px; height: 74px; object-fit: cover; border-radius: 15%;">
            </a>
            <a href="{% url 'about' %}">About</a>
            <a href="/todos/new" class="button-link">Dashboard</a>
            <a href="{% url 'todos' %}">Todos</a>
            <a href="{% url 'teams_list' %}">Teams</a>
        </div>
        <div class="right">
            <span>{{ user_email }}</span>
        </div>
    </div>

    <!-- Main Content Section -->
    <div class="main-container">
        <div class="container">
            <h1>Create Team</h1>
            <form method="POST">
                {% csrf_token %}
                <label for="team_name">Team Name</label>
                <input type="text" id="team_name" name="team_name" placeholder="Enter team name" 
                       value="{{ team_name|default:'' }}" class="{% if error_team_name %}error{% endif %}" required>
                {% if error_team_name %}
                    <div class="error-message">{{ error_team_name }}</div>
                {% endif %}

                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" 
                          placeholder="Enter team description" class="{% if error_description %}error{% endif %}">
                    {{ description|default:'' }}
                </textarea>
                {% if error_description %}
                    <div class="error-message">{{ error_description }}</div>
                {% endif %}

                <div class="buttons">
                    <button type="button" class="cancel" onclick="location.href='{% url &quot;teams_list&quot; %}';">Cancel</button>
                    <button type="submit" class="create">Create</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
