<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            border: 1px solid black;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid black;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        .header div, .header a {
            color: black;
            margin-right: 5px;
        }
        .button-link {
            display: inline-block;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 2px;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 50%;
            margin: auto;
        }
        .content h4 {
            margin-bottom: 10px;
            text-align: left;
            width: 100%;
        }
        table {
            margin-top: 20px;
            width: 50%;
            position: absolute;
            bottom: 100px;
            right: 50px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .buttons {
            position: absolute;
            bottom: 50px;
            right: 50px;
            display: flex;
            gap: 10px;
        }
        .buttons button {
            font-size: 14px;
            padding: 5px 10px;
        }
        .add-member-container {
            text-align: left;
            margin-top: 20px;
        }
        .add-member-container input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="left">
                <div>$APPNAME</div>
                <a href="{% url 'about' %}" class="button-link">About</a>
            </div>
            <div class="right">
                <a href="/dashboard" class="button-link">Dashboard</a>
                <a href="/todos/new" class="button-link">Todos</a>
                <a href="/teams/new" class="button-link">Teams</a>
                <a href="#" class="button-link">{{ user.email }}</a>
            </div>
        </div>

        <h2>{{ team.name }}</h2>
       

        <div class="add-member-container">
            <h4>Team Name</h4>
            <p>$Description</p>
            <h4>Team Members</h4>
            <input type="text" placeholder="Add team member">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Team Members</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Team Member 1</td>
                </tr>
                <tr>
                    <td>Team Member 2</td>
                </tr>
                <tr>
                    <td>Team Member 3</td>
                </tr>
                <tr>
                    <td>Team Member 4</td>
                </tr>
                <tr>
                    <td>Team Member 5</td>
                </tr>
            </tbody>
        </table>

        <div class="buttons">
            <a href="{% url 'teams_list' %}" class="btn btn-danger">Cancel</a>
            <button type="button" class="btn btn-success">Update</button>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
