{% extends "base.html" %}
{% load static %}

{% block title %}Edit Team{% endblock %}

{% block extra_head %}
  <style>
    /* Page-specific styles for the Edit Team form */
    .form-container {
        max-width: 400px;
        margin: 0 auto;
        background-color: #fff;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: left;
    }
    .form-container h2 {
        margin-bottom: 20px;
        text-align: center;
    }
    .form-control {
        margin-bottom: 15px;
    }
    .form-label {
        display: block;
        margin-bottom: 5px;
        text-align: left;
    }
    .buttons {
        display: flex;
        justify-content: center;
        margin-top: 20px;
    }
    .buttons a, .buttons button {
        margin: 0 5px;
    }
  </style>
{% endblock %}

{% block content %}
  <div class="form-container">
    <h2>Edit Team</h2>
    <form method="POST">
      {% csrf_token %}
      <!-- Team Name Field -->
      <div class="mb-3">
        <label for="id_name" class="form-label">Team Name</label>
        {{ form.name }}
      </div>
      <!-- Description Field -->
      <div class="mb-3">
        <label for="id_description" class="form-label">Description</label>
        {{ form.description }}
      </div>
      <!-- Action Buttons -->
      <div class="buttons">
        <a href="/teams_list/" class="btn btn-danger me-3">Cancel</a>
        <button type="submit" class="btn button_logoPurple">Save Changes</button>
      </div>
    </form>
  </div>
{% endblock %}
