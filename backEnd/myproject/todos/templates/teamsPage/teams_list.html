<!DOCTYPE html>
<html lang="en">
<head>
    <title>Team List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- Custom styles for header and overall layout -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            border: 1px solid black;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid black;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        .header div, .header a {
            color: black;
            margin-right: 5px;
        }
        .logo {
            max-width: 400px;
            margin-top: 80px;
        }
        .button-link {
            display: inline-block;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <!-- Buttons to make it functional-->
    <div class="container">
        <div class="header">
            <div class="left">
                <div>$APPNAME</div>
                <a href="/about" class="button-link button-login">About</a>
            </div>
            <div class="right">
               
                <a href="#" class="button-link">Dashboard</a>
                <a href="/todos/new" class="button-link">Todos</a>
                <a href="#" class="button-link">Teams</a>
                <a href="/logout" class="button-link">{{ user.email }}</a> 
            </div>
        </div>
        
    <!-- Page Title -->
    <h1 class="text-center mb-4">Teams List</h1>
    <ul>
        <!-- Teams List -->
        {% for team in teams %}
            <li>
                <a href="{% url 'team_details' team.id %}">{{ team.name }}</a>
            </li>
        {% empty %}
            <li>No teams available. <a href="{% url 'create_team' %}">Create a new team</a>.</li>
        {% endfor %}
    </ul>
</body>
</html>
