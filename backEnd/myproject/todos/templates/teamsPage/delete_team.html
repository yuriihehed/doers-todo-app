{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TEST delete_team.html</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'todos/css/stylesheet.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:rgb(247, 242, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
        
            text-align: center;
            width: 100%; 
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid black; 
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .right {
            display: flex;
            align-items: center;
            margin-left: auto; 
        }
        .header div, .header a {
            color: black;
            margin-right: 5px; 
        }
        .button-link {
            display: inline-block;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 2px;
        }
        .content {
            text-align: left;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px; /* Add margin-bottom for spacing */
        }
        .card {
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .card-img-top {
            height: 150px;
            background-color: #6c757d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .card-body {
            padding: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="left">
                <a href="/" class="button-link" style="background: none; padding: 0; border: none; margin-right: 10px; ">
                    <img src=" {% static 'todos/images/DoersLogo.png' %}" style="width: 120px; height: 74px; object-fit: cover; border-radius: 15%;">
                </a>
                <a href="/about" class="button-link">About</a>
            </div>
            <div class="right">
                {% if user.is_authenticated %}
            <a href="/dashboard" class="button-link">Dashboard</a>
            <a href="/todos/new" class="button-link">Todos</a>
            <a href="/teams/new" class="button-link">Teams</a>
            <a href="/logout" class="button-link button-login">{{ user.email }}</a>
        {% else %}
            <a href="/login" class="button-link button-login">Login</a>
        {% endif %}
            </div>
        </div>

        <!-- Confirmation Message -->
        <p>Are you sure you want to delete the team <strong>{{ team.name }}</strong>?</p>

        <!-- Action Buttons -->
        <form method="POST">
            {% csrf_token %}
            <div class="button-container">
                <!-- Cancel Button -->
                <a href="{% url 'teams_list' %}" class="btn btn-secondary">Cancel</a>
                <!-- Confirm Delete Button -->
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
