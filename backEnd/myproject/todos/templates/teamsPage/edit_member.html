<!-- Team members edit page-->
 <!-- This file is the functionality for the specified team with its team members -->
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Edit Member</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #fffef2;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Header styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            /* Full width of the container */
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            padding: 10px 0;
            /* Add padding for spacing */
            margin-bottom: 20px;
        }

        .left {
            display: flex;
            /* Use flexbox for alignment */
            align-items: center;
            /* Center items vertically */
            gap: 10px;
            /* Add spacing between items */
        }

        .right {
            display: flex;
            /* Use flexbox for alignment */
            align-items: center;
            /* Center items vertically */
            gap: 10px;
            /* Add spacing between links */
            margin-left: auto;
            /* Push the right side to the edge */
        }

        .header-left img {
            width: 120px;
            height: auto;
            border-radius: 10%;
            /* Slightly rounded edges */
            margin-right: 10px;
            /* Add space between the logo and text */
        }

        .button-link {
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
        }

        .header a {
            text-decoration: none;
            /* Remove underline from links */
            color: black;
            /* Set text color to black */
            padding: 8px 12px;
            /* Add padding for a button-like feel */
            border-radius: 5px;
            /* Rounded corners */
            background-color: rgb(182, 182, 230);
            /* Light purple background */
            font-size: 16px;
            /* Font size for readability */
            white-space: nowrap;
        }

        .header a:hover {
            background-color: rgb(150, 150, 200);
            /* Darker purple on hover */
        }
        

        /* Team details section */
        .team-details {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .team-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .team-description {
            font-size: 18px;
            color: gray;
            margin-bottom: 20px;
        }

        /* Members section */
        .members-section {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .members-list {
            flex: 2;
            margin-left: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
        }

        /* Add member form */
        .add-member-form {
            flex: 3;
        }

        .add-member-form .input-group {
            margin-bottom: 10px;
        }

        /* Action buttons styling */
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .action-buttons button,
        .action-buttons a {
            margin-left: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }

        .btn-cancel {
            background-color: red;
            color: white;
        }

        .btn-update {
            background-color: green;
            color: white;
        }

        .btn-delete {
            background-color: #d9534f;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Edit Member: {{member.user.email}}</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Member Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{member.user.email }}" required>
            </div>
            <button type="submit" class="btn btn-success">Save Changes</button>
            <a href="{% url 'team_details' team.id %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
