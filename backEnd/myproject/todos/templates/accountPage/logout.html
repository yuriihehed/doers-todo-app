{% extends "base.html" %}
{% load static %}

{% block title %}Logout{% endblock %}

{% block extra_head %}
<style>
  .yes-button {
    background-color: green;
    color: #fff;  /* ensure text is readable against green */
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
  }
  
  .no-button {
    background-color: red;
    color: #fff;  /* ensure text is readable against red */
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none; /* remove underline if it's an <a> link */
  }
</style>
{% endblock extra_head %}

{% block content %}
    <h1>Logout</h1>
    <p>You are signed in as <strong>{{ user.email }}</strong>. Would you like to log out?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button yes-button">Yes</button>
        <a href="/dashboard" class="button no-button">No</a>
    </form>
{% endblock %}
