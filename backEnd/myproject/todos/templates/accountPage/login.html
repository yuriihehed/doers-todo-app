{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .button-edit {
            background-color: rgb(104,48,187);
            color: rgb(255, 245, 245);
        }
        .container {
            border: 1px solid black; 
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid black;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        .header div, .header a {
            color: black;
            margin-right: 5px;
        }
        .button-link {
            display: inline-block;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 2px;
        }
        .form-container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }
        .form-container h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .form-control {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
        }
        .buttons button {
            flex: 1;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Header section -->
        <div class="header">
            <div class="left">
                <a href="/" class="button-link" style="background: none; padding: 0; border: none; margin-right: 10px; ">
                    <img src=" {% static 'todos/images/DoersLogo.png' %}" style="width: 120px; height: 74px; object-fit: cover; border-radius: 15%;">
                </a>
                <a href="/about" class="button-link button-login">About</a> <!-- Button for about -->
            </div>
            <div class="right">
                <a href="/login" class="button-link button-login">Login</a> <!-- Button for login -->
            </div>
        </div>

        <!-- Form section -->
        <div class="form-container">
            <h2>Login</h2>
            <form method="POST"> <!-- Form for login -->
                {% csrf_token %} <!-- CSRF token -->
                
                <!-- Email input -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        class="form-control {% if error and request.method == 'POST' %}is-invalid{% endif %}">
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        class="form-control {% if error and request.method == 'POST' %}is-invalid{% endif %}">
                </div>

                <!-- Error message -->
                {% if error and request.method == 'POST' %}
                    <div class="error-message">Invalid email or password</div>
                {% endif %}

                <!-- Buttons -->
                <div class="buttons">
                    <button type="submit" class="btn button-edit">Login</button> <!-- submit the form -->
                    <button type="button" class="btn btn-secondary" onclick="location.href='{% url 'forgot_password' %}';">Forgot Password</button>
                    <button type="button" class="btn btn-secondary" onclick="location.href='{% url 'register' %}';">Sign Up</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
