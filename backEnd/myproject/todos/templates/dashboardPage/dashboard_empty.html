{% extends "base.html" %}
{% load static %}

{% block title %}Dashboard - Empty{% endblock %}

{% block extra_head %}
  <style>
    /* Optional additional styles for this empty dashboard page */
    h1 {
      margin-top: 40px;
      font-size: 2rem;
    }
    /* Purple "Create New ToDo" button, matching the common button styling */
    .button-create {
      background-color: purple;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
{% endblock %}

{% block content %}
  <h1>No ToDo's</h1>
  <a href="/todos/new" class="button button-create">Create New ToDo</a>
{% endblock %}
