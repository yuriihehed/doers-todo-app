{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Empty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            border: 1px solid black; 
            text-align: center;
            width: 100%; 
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            position: relative; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid black; 
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .left {
            display: flex;
            align-items: center;
        }
        .right {
            display: flex;
            align-items: center;
            margin-left: auto; 
        }
        .header div, .header a {
            color: black;
            margin-right: 5px; 
        }
        .logo {
            max-width: 400px; 
            margin-top: 80px; 
        }
        .button-link {
            display: inline-block;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            background-color: rgb(182, 182, 230);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 2px;
        }
        .button-create {
            background-color: rgb(26, 26, 224);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="left">
                <a href="/" class="button-link" style="background: none; padding: 0; border: none; margin-right: 10px; ">
                    <img src=" {% static 'todos/images/DoersLogo.png' %}" style="width: 120px; height: 74px; object-fit: cover; border-radius: 25%;">
                </a>
                <a href="/about" class="button-link">About</a>
            </div>
            <div class="right">
                <a href="/dashboard" class="button-link">Dashboard</a> 
                <a href="/todos/new" class="button-link">Todos</a> 
                <a href="/teams/new" class="button-link">Teams</a>
                <a href="/logout" class="button-link">{{user.email}}</a> <!--TO DO Display user's email -->
                <!-- <span>{{ user.username }}</span> Display user's email -->
            </div>
        </div>
        <h1>No ToDo's</h1>
        <a href="/todos/new" class="button-link button-create">Create ToDo</a>
    </div>
</body>
</html>
