services:
  db:
    image: postgres:14
    container_name: team3_mini_database
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
    container_name: team3_mini_django_app
    volumes:
      - ./backend/myproject:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://team3postgres:password@team3_mini_database:5432/team3database

volumes:
  postgres_data:
